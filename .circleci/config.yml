version: 2.1

jobs:
  build_and_push:
    docker:
      - image: cimg/node:20.12.0
    environment:
      TAG: latest
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and Push Docker image
          command: |
            echo $DIGITALOCEAN_REGISTRY_NAME
            echo $DIGITALOCEAN_REGISTRY_USERNAME
            

workflows:
  my-workflow:
    jobs:
      - build_and_push:
          filters:
            branches:
              only:
                - egor_dev