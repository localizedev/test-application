version: 2.1

jobs:
  build_and_push:
    docker:
      - image: cimg/node:20.12.0
    environment:
      TAG: latest
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            docker build -t $DIGITALOCEAN_REGISTRY_NAME/test-application:$TAG .
      - run:
          name: Login to DigitalOcean Registry
          command: |
            echo $DIGITALOCEAN_REGISTRY_ACCESS_TOKEN | docker login -u $DIGITALOCEAN_REGISTRY_USERNAME --password-stdin $DIGITALOCEAN_REGISTRY_URL
      - run:
          name: Push Docker image to DigitalOcean Registry
          command: |
            docker push $DIGITALOCEAN_REGISTRY_NAME/test-application:$TAG

workflows:
  my-workflow:
    jobs:
      - build_and_push:
          filters:
            branches:
              only:
                - egor_dev